<div class="campo{% if campo.field.widget.input_type == 'checkbox' %} check-campo{% endif %}">
  {% if campo.field.widget.input_type == 'checkbox' %}
    <label class="check">{{ campo }} <span>{{ campo.label }}</span></label>
  {% else %}
    <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} *{% endif %}</label>
    {{ campo }}
  {% endif %}
  {% if campo.help_text %}<div class="ayuda">{{ campo.help_text|safe }}</div>{% endif %}
  {% for e in campo.errors %}<div class="error">{{ e }}</div>{% endfor %}
</div>
